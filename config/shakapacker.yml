# Note: You must restart bin/webpacker-dev-server for changes to take effect

default: &default
  source_path: app/webpacker
  source_entry_path: packs
  public_root_path: public
  public_output_path: packs
  cache_path: tmp/cache/webpacker
  webpack_compile_output: true

  # Additional paths webpack should look up modules
  # ['app/assets', 'engine/foo/app/assets']
  additional_paths: ['node_modules/govuk-frontend/dist/govuk']

  # Reload manifest.json on all requests so we reload latest compiled packs
  cache_manifest: false

  # CSS is now compiled by Dart Sass and served by Propshaft; webpack builds JS
  # only. Nothing imports stylesheets into the packs any more.
  extract_css: false

development:
  <<: *default
  compile: true

  # Reference: https://webpack.js.org/configuration/dev-server/
  dev_server:
    # TLS is handled by Caddy (see Caddyfile.dev); the dev server itself runs
    # over plain HTTP and is reverse-proxied at https://school-experience.localhost,
    # so packs and the live-reload websocket share the app's trusted origin.
    server: http
    host: localhost
    port: 3035
    public: school-experience.localhost
    # Hot Module Replacement updates modules while the application is running without a full reload
    hmr: false
    # Inline should be set to true if using HMR
    inline: true
    overlay: true
    # Defaults to the inverse of hmr. Uncomment to manually set this.
    # live_reload: true
    client:
      # Show the full-screen overlay for compiler/runtime errors, but not for
      # warnings (e.g. the govuk-frontend SCSS deprecation warnings), which
      # otherwise trigger the "Compiled with problems:" overlay on every build.
      overlay:
        errors: true
        warnings: false
        runtimeErrors: true
      # Connect the live-reload websocket back through Caddy (https origin).
      webSocketURL:
        hostname: school-experience.localhost
        protocol: wss
        port: 443
        pathname: /ws
    # Should we use gzip compression?
    compress: true
    disable_host_check: true
    use_local_ip: false
    quiet: false
    # Note that apps that do not check the host are vulnerable to DNS rebinding attacks
    allowed_hosts: "all"
    pretty: false
    headers:
      'Access-Control-Allow-Origin': '*'
    static:
      watch:
        ignored: '**/node_modules/**'

test:
  <<: *default
  compile: false

  # Compile test packs to a separate directory
  public_output_path: packs-test

production:
  <<: *default

  # Production depends on precompilation of packs prior to booting for performance.
  compile: false

  # CSS is now compiled by Dart Sass and served by Propshaft; webpack builds JS only.
  extract_css: false

  # Cache manifest.json for performance
  cache_manifest: true
