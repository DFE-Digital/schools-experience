plugins:
  - rubocop-rspec
  - rubocop-capybara
  - rubocop-factory_bot

inherit_gem:
  rubocop-govuk:
    - config/default.yml
    - config/rails.yml

Gemspec/RequiredRubyVersion:
  Exclude:
    - node_modules/dfe-autocomplete/dfe-autocomplete.gemspec

Gemspec/DevelopmentDependencies:
  Exclude:
    - node_modules/dfe-autocomplete/dfe-autocomplete.gemspec

