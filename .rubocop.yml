# These migrations are already deployed; rewriting their operations could
# change schema or data behavior for existing environments.
Rails/NotNullColumn:
  Exclude:
    - db/migrate/20190131110800_add_importable_fields_to_bookings_schools.rb
    - db/migrate/20190205091721_add_bookings_school_type_id_to_bookings_schools.rb
    - db/migrate/20190225114124_add_availability_to_placement_requests.rb
    - db/migrate/20190417081149_add_bookings_school_id_to_schools_school_profile.rb
    - db/migrate/20190426154201_link_bookings_placement_dates_to_bookings_schools.rb
    - db/migrate/20190524133255_add_cancelled_by_to_cancellations.rb

Rails/ReversibleMigration:
  Exclude:
    - db/migrate/20190125085522_make_bookings_schools_fees_default_to_zero.rb
    - db/migrate/20190125144531_make_subject_and_phase_names_not_nullable.rb
    - db/migrate/20190225092622_remove_access_needs_and_access_needs_details_from_candidates_registrations_placmenet_requests.rb
    - db/migrate/20190418180420_allow_bookings_placement_requests_availability_to_be_null.rb
    - db/migrate/20190426154201_link_bookings_placement_dates_to_bookings_schools.rb
    - db/migrate/20190510173936_allow_null_for_bookings_profiles_experience_details.rb
    - db/migrate/20190628082805_set_bookings_schools_enabeld_flag_to_false_by_default.rb
    - db/migrate/20190724092556_make_bookings_school_contact_email_not_null.rb
    - db/migrate/20190820073225_make_bookings_profile_dbs_required_nullable.rb
    - db/migrate/20191031105854_remove_column_default_from_bookings_placement_dates_subject_specific.rb

Metrics/BlockLength:
  Exclude:
    - config/**/*
    - spec/**/*

Layout/ArgumentAlignment:
  Enabled: false

# We have specific keywords we need to receive but not use in the error handler
# for Redis connections
Lint/UnusedBlockArgument:
  Exclude:
    - config/environments/*

Lint/MissingSuper:
  Enabled: false

# db/schema.rb is regenerated by Rails with an unseparated version number.
Style/NumericLiterals:
  Exclude:
    - "db/schema.rb"

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

Style/StringConcatenation:
  Enabled: false

Style/HashTransformValues:
  Enabled: true

# Prefer the single-line implicit-subject style; naming subjects would affect
# substantially more specs (1,071 offenses versus 231 for ImplicitSubject).
RSpec/ImplicitSubject:
  EnforcedStyle: single_line_only

RSpec/NamedSubject:
  Enabled: false

# These ceilings accommodate the largest existing specs while preventing further
# growth; examples beyond them should be simplified rather than raising the caps.
RSpec/ExampleLength:
  Max: 31

RSpec/MultipleExpectations:
  Max: 11

RSpec/MultipleMemoizedHelpers:
  Max: 15

RSpec/NestedGroups:
  Max: 6

Style/StringLiterals:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

# Brakeman (which relies on ruby-parser) does not yet support this syntax
# See https://github.com/seattlerb/ruby_parser/issues/326
Style/HashSyntax:
  EnforcedShorthandSyntax: never

Rails/DynamicFindBy:
  Enabled: false

# Rails/Exit's default Include is **/app/**/*.rb (+ config, lib). In CI the repo
# is mounted at /app, so that glob matches spec/ too and flags the standard
# Rails abort() guards in rails_helper.rb. An inline `# rubocop:disable` can't
# win here: outside /app the cop doesn't match, so the directive is reported as
# redundant locally. A file-level Exclude is path-independent and applies in
# both places.
Rails/Exit:
  Exclude:
    - spec/rails_helper.rb

Rails/FilePath:
  EnforcedStyle: arguments

Rails/HttpPositionalArguments:
  Exclude:
    - spec/controllers/candidates/dashboard_base_controller_spec.rb

# Excluded for cancellation because we use the same model for both school
# and candidate cancellations
Rails/InverseOf:
  Exclude:
    - app/models/bookings/placement_request/cancellation.rb

Rails/RakeEnvironment:
  Exclude:
    - lib/tasks/dev_ssl_generator.rake
    - lib/tasks/cucumber.rake

Rails/UnknownEnv:
  Environments:
    - development
    - test
    - servertest
    - staging
    - production

# These are considered safe to autofix but are not actually redundant
Rails/RedundantForeignKey:
  Exclude:
    - app/models/bookings/placement_date.rb
    - app/models/bookings/placement_request.rb
    - app/models/bookings/school.rb
    - app/models/event.rb
    - app/models/schools/school_profile.rb

# These break the build right now so we want to work thorugh them slowly
Rails/SaveBang:
  Enabled: false

Style/DateTime:
  Enabled: false

Rails/TimeZone:
  Enabled: false

Rails/Date:
  Enabled: false

AllCops:
  Exclude:
    - "node_modules/**/*"
    - "vendor/**/*"
    - "db/schema.rb"
    - "db/migrate/*.rb"
