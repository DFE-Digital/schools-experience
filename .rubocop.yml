    - db/migrate/20190329150543_add_dbs_fee_to_school_profile.rb
    - db/migrate/20190329164135_add_other_fee_to_school_profile.rb
    - db/migrate/20190401162830_add_phases_lists_to_school_profile.rb
    - db/migrate/20190403132018_add_key_stage_list_to_schools_school_profile.rb
    - db/migrate/20190408080917_add_specialism_to_school_profile.rb
    - db/migrate/20190408123541_add_candidate_eperience_detail_to_school_profile.rb
    - db/migrate/20190408154736_add_experience_outline_to_school_profile.rb
    - db/migrate/20190409094117_add_admin_contact_to_school_profile.rb
    - db/migrate/20190426154201_link_bookings_placement_dates_to_bookings_schools.rb
    - db/migrate/20190520155422_remove_availability_from_bookings_profile.rb
    - db/migrate/20190522114343_remove_availability_description_and_preference_from_schools_profile.rb
    - db/migrate/20190531141719_add_bookings_booking_acceptance_fields.rb
    - db/migrate/20190717131205_change_event_gitis_uuid_to_bookings_candidate_id.rb
    - db/migrate/20190801095642_add_fees_wizard_state_fields_to_school_profiles.rb
    - db/migrate/20190816113709_add_dbs_requirement_columns_to_schools_on_boarding_profile.rb
