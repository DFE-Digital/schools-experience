    - db/migrate/20190906131351_add_access_needs_fields_to_schools_school_profiles.rb
    - db/migrate/20190909102743_add_access_needs_fields_to_bookings_profiles.rb
    - db/migrate/20190916105024_add_successful_visit_to_feedbacks.rb
    - db/migrate/20191108132921_add_photo_id_requirements_to_schools_school_profiles.rb
    - db/migrate/20210121091849_add_online_to_bookings_placement_dates.rb
    - db/migrate/20210130095443_add_dbs_policy_conditions_to_bookings_profile.rb
    - db/migrate/20220119115856_add_availability_offsets_to_bookings_placement_dates.rb
